# configs/data.yaml — rutas, versiones de datasets, splits.
# Consumido por src/data/make_dataset.py, merge_corpora.py, build_splits.py.
data:
  root: ./data
  raw_subdir: raw
  interim_subdir: interim
  processed_subdir: processed
  sources:
    coello_guilarte:
      enabled: true
      url: "https://ccc.inaoep.mx/~mmontesg/resources/CrossLingualDepression.zip"
      license: "Research use, citation required"
      cite: "Coello-Guilarte et al. (2019). Cross-Lingual Depression Detection in Twitter"
    mentalriskes_github:
      enabled: false  # cifrado con contraseña (ver src/data/download/download_mentalriskes_github.py)
      url: "https://github.com/sinai-uja/corpusMentalRiskES/raw/main/corpusMentalRiskES.zip"
      license: "Gated — contact authors"
    # --- Corpus en inglés: se procesan a interim/ con lang=en y se traducen
    #     con `make translate`. merge_corpora sólo los incluye cuando existe
    #     interim/<fuente>/data_es.parquet (translate: true).
    kaggle_sdd:
      enabled: true
      translate: true
      kaggle_slug: "nikhileswarkomati/suicide-watch"
      license: "Ver ficha Kaggle; datos públicos de Reddit"
    reddit_mh_posts:
      enabled: true
      translate: true
      hf_id: "solomonk/reddit_mental_health_posts"
      license: "Sin licencia declarada; datos públicos de Reddit"
    depression_reddit:
      enabled: true
      translate: true
      hf_id: "mrjunos/depression-reddit-cleaned"
      license: "CC BY 4.0"
    swmh:
      enabled: true  # gated (auto): aceptar términos en HF + huggingface-cli login
      translate: true
      hf_id: "AIMH/SWMH"
      license: "CC BY-NC 4.0"
    redsm5_sample:
      enabled: false  # gated (manual): pedir acceso en HF; loader pendiente de ver el formato
      translate: true
      hf_id: "irlab-udc/redsm5"
      license: "Apache-2.0"
    # --- Ya en español ---
    prevenia_es:
      enabled: true
      merge: false  # constructo = intención suicida, no depresión; se usa aparte
      hf_id: "PrevenIA/spanish-suicide-intent"
      license: "CC BY 4.0"
    emoevales:
      enabled: false  # el ID de HF no existe (401); emociones, baja relevancia
      hf_id: "JaviBoyaEmotionAnalyzer/emoevales"
      license: "Research use"
    swmh_es:
      enabled: false  # el ID de HF no existe (401); reemplazado por `swmh` + traducción
      hf_id: "jorgeortizfuentes/swmh_es"
      license: "Mixed (see HF dataset card)"
    synthetic:
      enabled: true
      path: "src/data/synthetic/sample.jsonl"
      license: "Generated for pipeline testing only"
  label_map:
    0: control
    1: moderate
    2: depressive

splits:
  strategy: "user_level_stratified"
  train: 0.7
  val: 0.1
  test: 0.2
  seed: 42
  min_messages_per_user: 1

anonymize:
  remove_urls: true
  remove_mentions: true
  remove_emails: true
  remove_phones: true
  keep_hashtags: false
  normalize_whitespace: true
  lowercase: false  # BETO usa cased
